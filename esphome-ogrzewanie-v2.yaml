        # Sypialnia - POWRÓT (Akcent Różowy)
        - button:
            id: tile_sypialnia
            align: TOP_LEFT
            x: 125
            y: 215
            width: 110
            height: 100
            bg_color: 0x0D0010
            bg_grad_color: 0x1A0020
            bg_grad_dir: VER
            radius: 6
            border_width: 1
            border_color: 0x660088
