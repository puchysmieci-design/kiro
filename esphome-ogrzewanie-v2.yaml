    # ==========================================
    # STRONA 3: TERMOSTAT + VIP BUTTONS
    # Mapowanie osi (fizyczny portrait, USB dół):
    #   LVGL x → pion fizyczny (0=dół, 240=góra)
    #   LVGL y → poziom fizyczny (0=lewa, 320=prawa)
    #   LVGL width → fizyczna wysokość elementu
    #   LVGL height → fizyczna szerokość elementu
    #
    # VIP kolumna (prawa): y=215, height=100 (fiz.szer.100px)
    #   3 przyciski: width=78, x=162/82/2 (góra/środek/dół)
    # Termostat (lewa): y=5, height=205 (fiz.szer.205px)
    # ==========================================
    - id: thermostat_page
      bg_color: 0x000000
      scrollable: false
      widgets:

        # ======= TERMOSTAT (lewa strona fizycznie, y=5-210) =======

        # --- PRZYCISK POWRÓT ---
        - button:
            id: btn_thermo_back
            align: TOP_LEFT
            x: 210
            y: 5
            width: 28
            height: 50
            bg_color: 0x0D0010
            radius: 8
            border_width: 1
            border_color: 0x660088
            pressed:
              bg_color: 0x1A0028
              border_color: 0xFF00FF
            on_click:
              - lvgl.page.show:
                  id: weather_page
                  animation: MOVE_RIGHT
            widgets:
              - label:
                  text: "<"
                  text_font: font_timer
                  text_color: 0xCC44FF
                  align: CENTER
                  transform_rotation: 90

        # --- TYTUŁ "Vaillant Salon" ---
        - label:
            id: thermo_title
            text: "Vaillant Salon"
            text_font: font_labels
            text_color: 0xFFFFFF
            align: TOP_LEFT
            x: 215
            y: 60
            transform_rotation: 90

        # --- STATUS ---
        - label:
            id: thermo_status_label
            text: "wyłączono"
            text_font: font_labels
            text_color: 0x666666
            align: TOP_LEFT
            x: 195
            y: 70
            transform_rotation: 90

        # --- ARC (pierścień termostatu) ---
        - arc:
            id: thermo_arc
            align: TOP_LEFT
            x: 50
            y: 25
            width: 140
            height: 165
            min_value: 0
            max_value: 100
            value: 50
            start_angle: 135
            end_angle: 45
            rotation: 90
            adjustable: false
            arc_color: 0x222222
            arc_width: 6
            indicator:
              arc_color: 0x005577
              arc_width: 6

        # --- DUŻA TEMPERATURA AKTUALNA (w środku arcu) ---
        - label:
            id: thermo_current_temp
            text: "--.-°C"
            text_font: font_timer
            text_color: 0xFFFFFF
            align: TOP_LEFT
            x: 130
            y: 80
            transform_rotation: 90

        # --- TEMPERATURA ZADANA ---
        - label:
            id: thermo_target_temp
            text: "--.- °C"
            text_font: font_labels
            text_color: 0x00AACC
            align: TOP_LEFT
            x: 105
            y: 85
            transform_rotation: 90

        # --- LABEL "Zadana na sterowniku" ---
        - label:
            id: thermo_zadana_label
            text: "Zadana: -- °C"
            text_font: font_labels
            text_color: 0xFF9800
            align: TOP_LEFT
            x: 30
            y: 70
            transform_rotation: 90

        # --- PRZYCISK MINUS (-) fizycznie na dole termostatu ---
        - button:
            id: btn_thermo_minus
            align: TOP_LEFT
            x: 2
            y: 5
            width: 45
            height: 45
            styles: style_thermo_btn
            pressed:
              styles: style_thermo_btn_pressed
            on_click:
              - homeassistant.service:
                  service: climate.set_temperature
                  data:
                    entity_id: climate.vaillant_salon
                  data_template:
                    temperature: "{{ state_attr('climate.vaillant_salon', 'temperature') | float - 0.5 }}"
            widgets:
              - label:
                  text: "-"
                  text_font: font_timer
                  text_color: 0xFFFFFF
                  align: CENTER
                  transform_rotation: 90

        # --- PRZYCISK PLUS (+) fizycznie na górze termostatu ---
        - button:
            id: btn_thermo_plus
            align: TOP_LEFT
            x: 2
            y: 160
            width: 45
            height: 45
            styles: style_thermo_btn
            pressed:
              styles: style_thermo_btn_pressed
            on_click:
              - homeassistant.service:
                  service: climate.set_temperature
                  data:
                    entity_id: climate.vaillant_salon
                  data_template:
                    temperature: "{{ state_attr('climate.vaillant_salon', 'temperature') | float + 0.5 }}"
            widgets:
              - label:
                  text: "+"
                  text_font: font_timer
                  text_color: 0xFFFFFF
                  align: CENTER
                  transform_rotation: 90

        # ======= VIP BUTTONS (prawa kolumna fizycznie) =======
        # Stałe y=215, height=100 (fizyczna szerokość kolumny)
        # width=78 (fizyczna wysokość, max wypełnienie: 3*78+6gap=240)
        # x: 162(góra), 82(środek), 2(dół)

        # --- VIP GÓRA (na górze fizycznie) ---
        - button:
            id: btn_gora_t
            align: TOP_LEFT
            x: 162
            y: 215
            width: 78
            height: 100
            styles: style_btn_vip_default
            pressed:
              styles: style_btn_vip_pressed
            on_click:
              - homeassistant.service:
                  service: script.vip_dogrzewanie_gory_1h
            widgets:
              - image: {src: img_gora, align: CENTER, transform_rotation: 90, x: 8, zoom: 128}
              - label:
                  id: label_gora_t
                  text: "GÓRA"
                  text_font: font_labels
                  text_color: 0x00AACC
                  align: CENTER
                  text_align: CENTER
                  transform_rotation: 90
                  x: 35

        # --- VIP DÓŁ (środek fizycznie) ---
        - button:
            id: btn_dol_t
            align: TOP_LEFT
            x: 82
            y: 215
            width: 78
            height: 100
            styles: style_btn_vip_default
            pressed:
              styles: style_btn_vip_pressed
            on_click:
              - homeassistant.service:
                  service: script.vip_dogrzewanie_dolu_1h
            widgets:
              - image: {src: img_dol, align: CENTER, transform_rotation: 90, x: 8, zoom: 128}
              - label:
                  id: label_dol_t
                  text: "DÓŁ"
                  text_font: font_labels
                  text_color: 0x00AACC
                  align: CENTER
                  text_align: CENTER
                  transform_rotation: 90
                  x: 35

        # --- VIP DOM (na dole fizycznie) ---
        - button:
            id: btn_dom_t
            align: TOP_LEFT
            x: 2
            y: 215
            width: 78
            height: 100
            styles: style_btn_vip_default
            pressed:
              styles: style_btn_vip_pressed
            on_click:
              - homeassistant.service:
                  service: script.vip_dogrzewanie_domu_1h
            widgets:
              - image: {src: img_dom, align: CENTER, transform_rotation: 90, x: 8, zoom: 128}
              - label:
                  id: label_dom_t
                  text: "DOM"
                  text_font: font_labels
                  text_color: 0x00AACC
                  align: CENTER
                  text_align: CENTER
                  transform_rotation: 90
                  x: 35
