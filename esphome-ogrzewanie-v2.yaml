# ==========================================
# SENSORY Z HA
# ==========================================
sensor:
  - platform: homeassistant
    id: temp_sypialnia
    entity_id: sensor.srednia_temperatura_sypialni
    on_value:
      then:
        - lambda: |-
            char buf[32];
            sprintf(buf, "< Sypialnia\n%.1f °C", x);
            lv_label_set_text(id(label_temp_sypialnia), buf);

  - platform: homeassistant
    id: temp_sara
    entity_id: sensor.srednia_temperatura_u_sary
    on_value:
      then:
        - lambda: |-
            char buf[32];
            sprintf(buf, "U Sary\n%.1f °C", x);
            lv_label_set_text(id(label_temp_sara), buf);

  - platform: homeassistant
    id: temp_biuro
    entity_id: sensor.srednia_temperatura_biuro
    on_value:
      then:
        - lambda: |-
            char buf[32];
            sprintf(buf, "Biuro\n%.1f °C", x);
            lv_label_set_text(id(label_temp_biuro), buf);

  - platform: homeassistant
    id: temp_salon
    entity_id: climate.vaillant_salon
    attribute: current_temperature
    on_value:
      then:
        - lambda: |-
            char buf[32];
            sprintf(buf, "Salon >\n%.1f °C", x);
            lv_label_set_text(id(label_temp_salon), buf);

  - platform: homeassistant
    id: temp_th06
    entity_id: sensor.th06_2_temperatura
    on_value:
      then:
        - lambda: |-
            char buf[32];
            sprintf(buf, "TH06\n%.1f °C", x);
            lv_label_set_text(id(label_temp_th06), buf);

  - platform: homeassistant
    id: temp_zewnatrz
    entity_id: sensor.ebusd_broadcast_outsidetemp
    on_value:
      then:
        - lambda: |-
            char buf[32];
            sprintf(buf, "Zewnątrz\n%.1f °C", x);
            lv_label_set_text(id(label_temp_zewnatrz), buf);

  # --- TERMOSTAT VAILLANT ---
  - platform: homeassistant
    id: vaillant_current_temp
    entity_id: climate.vaillant_salon
    attribute: current_temperature
    on_value:
      then:
        - lambda: |-
            char buf[16];
            sprintf(buf, "%.1f°C", x);
            lv_label_set_text(id(thermo_current_temp), buf);
            float target = id(vaillant_target_temp).state;
            if (!isnan(target) && x > target) {
              lv_obj_set_style_arc_color(id(thermo_arc), lv_color_hex(0xFF6600), LV_PART_INDICATOR);
              lv_obj_set_style_text_color(id(thermo_current_temp), lv_color_hex(0xFF6600), LV_PART_MAIN);
            } else {
              lv_obj_set_style_arc_color(id(thermo_arc), lv_color_hex(0x005577), LV_PART_INDICATOR);
              lv_obj_set_style_text_color(id(thermo_current_temp), lv_color_hex(0xFFFFFF), LV_PART_MAIN);
            }

  - platform: homeassistant
    id: vaillant_target_temp
    entity_id: climate.vaillant_salon
    attribute: temperature
    on_value:
      then:
        - lambda: |-
            char buf[16];
            sprintf(buf, "%.1f °C", x);
            lv_label_set_text(id(thermo_target_temp), buf);
            // Update arc value (range 5-30)
            int val = (int)((x - 5.0) * 100.0 / 25.0);
            if (val < 0) val = 0;
            if (val > 100) val = 100;
            lv_arc_set_value(id(thermo_arc), val);

  - platform: homeassistant
    id: vaillant_zadana_odczyt
    entity_id: sensor.vaillant_zadana_temperatura_odczyt
    on_value:
      then:
        - lambda: |-
            char buf[32];
            sprintf(buf, "Zadana: %.1f °C", x);
            lv_label_set_text(id(thermo_zadana_label), buf);

# ==========================================
# TEXT SENSORY
# ==========================================
text_sensor:
  - platform: homeassistant
    id: timer_status
    entity_id: sensor.esphome_czas_vip_odliczanie
    on_value:
      then:
        - lambda: |-
            if (x == "idle" || x == "GOTOWY") {
              lv_label_set_text(id(timer_label), "CZAS VIP: GOTOWY");
            } else {
              lv_label_set_text(id(timer_label), ("CZAS VIP: " + x).c_str());
            }

  - platform: homeassistant
    id: vaillant_hvac_action
    entity_id: climate.vaillant_salon
    attribute: hvac_action
    on_value:
      then:
        - lambda: |-
            std::string status;
            if (x == "heating") {
              status = "Grzanie";
              lv_obj_set_style_text_color(id(thermo_status_label), lv_color_hex(0xFF6600), LV_PART_MAIN);
              lv_obj_set_style_arc_color(id(thermo_arc), lv_color_hex(0xFF6600), LV_PART_INDICATOR);
            } else if (x == "idle") {
              status = "Bezczynność";
              lv_obj_set_style_text_color(id(thermo_status_label), lv_color_hex(0x888888), LV_PART_MAIN);
              lv_obj_set_style_arc_color(id(thermo_arc), lv_color_hex(0x005577), LV_PART_INDICATOR);
            } else if (x == "off") {
              status = "wyłączono";
              lv_obj_set_style_text_color(id(thermo_status_label), lv_color_hex(0x666666), LV_PART_MAIN);
              lv_obj_set_style_arc_color(id(thermo_arc), lv_color_hex(0x333333), LV_PART_INDICATOR);
            } else {
              status = x.c_str();
              lv_obj_set_style_text_color(id(thermo_status_label), lv_color_hex(0x888888), LV_PART_MAIN);
            }
            lv_label_set_text(id(thermo_status_label), status.c_str());

  - platform: homeassistant
    id: vaillant_hvac_mode
    entity_id: climate.vaillant_salon

