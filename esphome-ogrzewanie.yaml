esphome:
  name: esphome-web-5c9a6c
  friendly_name: ESP Ogrzewanie
  on_boot:
    priority: -100
    then:
      - light.turn_on:
          id: backlight_light
          brightness: 80%

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: INFO

