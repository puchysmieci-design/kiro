              lv_obj_set_style_bg_grad_color(id(btn_gora), lv_color_hex(0x330044), LV_PART_MAIN);
              lv_obj_set_style_bg_grad_dir(id(btn_gora), LV_GRAD_DIR_VER, LV_PART_MAIN);
              lv_obj_set_style_border_color(id(btn_gora), lv_color_hex(0xFF00FF), LV_PART_MAIN);
              lv_obj_set_style_border_width(id(btn_gora), 3, LV_PART_MAIN);
              lv_obj_set_style_shadow_color(id(btn_gora), lv_color_hex(0xFF00FF), LV_PART_MAIN);
              lv_obj_set_style_shadow_width(id(btn_gora), 15, LV_PART_MAIN);
              lv_obj_set_style_shadow_spread(id(btn_gora), 2, LV_PART_MAIN);
              lv_obj_set_style_shadow_opa(id(btn_gora), LV_OPA_60, LV_PART_MAIN);
