# ==========================================
# HARDWARE
# ==========================================
spi:
  - id: spi_display
    clk_pin: GPIO14
    mosi_pin: GPIO13
  - id: spi_touch
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

output:
  - platform: ledc
    pin: GPIO21
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    id: backlight_light
    restore_mode: ALWAYS_ON

display:
  - platform: ili9xxx
    model: ILI9341
    id: my_display
    spi_id: spi_display
    cs_pin: GPIO15
    dc_pin: GPIO2
    reset_pin: GPIO4
    invert_colors: false 
    color_order: bgr
    transform:
      swap_xy: true

touchscreen:
  - platform: xpt2046
    id: my_touch
    spi_id: spi_touch
    cs_pin: GPIO33
    update_interval: 50ms
    transform:
      mirror_y: true
    calibration:
      x_min: 200
      x_max: 3800
      y_min: 200
      y_max: 3800
    on_touch:
      - if:
          condition:
            light.is_off: backlight_light
          then:
            - light.turn_on:
                id: backlight_light
                brightness: 80%

# ==========================================
# LVGL GRAFIKA - PREMIUM CYBERPUNK UI
# ==========================================
lvgl:
  buffer_size: 20%
  displays:
    - my_display
  touchscreens:
    - my_touch
  style_definitions:
    # --- STYL BAZOWY DLA PRZYCISKÓW VIP ---
    - id: style_btn_vip_default
      bg_color: 0x0A0A14
      bg_grad_color: 0x0D1117
      bg_grad_dir: VER
      radius: 8
      border_width: 1
      border_color: 0x005577
      shadow_width: 0
      pad_all: 4
    # --- STYL PRESSED (dotknięcie) ---
    - id: style_btn_vip_pressed
      bg_color: 0x001122
      bg_grad_color: 0x002244
      bg_grad_dir: VER
      border_color: 0x00FFFF
      border_width: 2
      shadow_color: 0x00FFFF
      shadow_width: 8
      shadow_spread: 1
      shadow_opa: COVER
    # --- STYL BAZOWY DLA KAFELKÓW TEMP ---
    - id: style_tile_default
      bg_color: 0x0A0A14
      bg_grad_color: 0x0F1318
      bg_grad_dir: VER
      radius: 6
      border_width: 1
      border_color: 0x003344
      shadow_width: 0
      pad_all: 4
    # --- STYL PRESSED DLA KAFELKÓW ---
    - id: style_tile_pressed
      bg_color: 0x001122
      border_color: 0x00CCEE
      border_width: 2
      shadow_color: 0x00CCEE
      shadow_width: 6
      shadow_opa: COVER
    # --- STYL TIMER PANEL ---
    - id: style_timer_default
      bg_color: 0x0D0010
      bg_grad_color: 0x1A0028
      bg_grad_dir: VER
      radius: 8
      border_width: 1
      border_color: 0x660088
      shadow_width: 0
    - id: style_timer_pressed
      bg_color: 0x1A0028
      border_color: 0xFF00FF
      border_width: 2
      shadow_color: 0xFF00FF
      shadow_width: 10
      shadow_opa: COVER
    # --- STYL SLEEP ---
    - id: style_sleep_default
      bg_color: 0x0A0A05
      bg_grad_color: 0x141408
      bg_grad_dir: VER
      radius: 8
      border_width: 1
      border_color: 0x555500
      shadow_width: 0
    - id: style_sleep_pressed
      bg_color: 0x1A1A00
      border_color: 0xFFFF00
      border_width: 2
      shadow_color: 0xFFFF00
      shadow_width: 10
      shadow_opa: COVER

  pages:
