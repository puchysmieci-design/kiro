    size: 16
    glyphs: " ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789:;.,°<>ĄąĆćĘęŁłŃńÓóŚśŹźŻż"
  
  - file: "gfonts://Roboto"
    id: font_timer 
    size: 24
    glyphs: " ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789:;.,°<>ĄąĆćĘęŁłŃńÓóŚśŹźŻż"

  - file: "gfonts://Roboto"
    id: font_bold
    size: 16
    glyphs: " ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789:;.,°<>ĄąĆćĘęŁłŃńÓóŚśŹźŻż"

# ==========================================
# IKONY
# ==========================================
image:
  - file: "radiator-custom.png"
    id: img_gora
    type: RGB565
    transparency: alpha_channel
  - file: "heating-coil-custom.png"
    id: img_dol
    type: RGB565
    transparency: alpha_channel
  - file: "home-thermometer-custom.png"
    id: img_dom
    type: RGB565
    transparency: alpha_channel

# ==========================================
# WIFI
# ==========================================
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
ota:
  - platform: esphome

# ==========================================
# SENSORY Z HA
# ==========================================
sensor:
  - platform: homeassistant
    id: temp_sypialnia
    entity_id: sensor.srednia_temperatura_sypialni
    on_value:
      then:
        - lambda: |-
            char buf[32];
            sprintf(buf, "< Sypialnia\n%.1f °C", x);
            lv_label_set_text(id(label_temp_sypialnia), buf);

  - platform: homeassistant
    id: temp_sara
    entity_id: sensor.srednia_temperatura_u_sary
    on_value:
      then:
        - lambda: |-
            char buf[32];
            sprintf(buf, "U Sary\n%.1f °C", x);
            lv_label_set_text(id(label_temp_sara), buf);

  - platform: homeassistant
    id: temp_biuro
    entity_id: sensor.srednia_temperatura_biuro
    on_value:
      then:
        - lambda: |-
            char buf[32];
            sprintf(buf, "Biuro\n%.1f °C", x);
            lv_label_set_text(id(label_temp_biuro), buf);

  - platform: homeassistant
    id: temp_salon
    entity_id: climate.vaillant_salon
    attribute: current_temperature
    on_value:
      then:
        - lambda: |-
            char buf[32];
            sprintf(buf, "Salon\n%.1f °C", x);
            lv_label_set_text(id(label_temp_salon), buf);

  - platform: homeassistant
    id: temp_th06
    entity_id: sensor.th06_2_temperatura
    on_value:
      then:
        - lambda: |-
            char buf[32];
            sprintf(buf, "TH06\n%.1f °C", x);
            lv_label_set_text(id(label_temp_th06), buf);

  - platform: homeassistant
    id: temp_zewnatrz
    entity_id: sensor.ebusd_broadcast_outsidetemp
    on_value:
      then:
        - lambda: |-
            char buf[32];
            sprintf(buf, "Zewnątrz\n%.1f °C", x);
            lv_label_set_text(id(label_temp_zewnatrz), buf);

# ==========================================
# TEXT SENSORY
# ==========================================
text_sensor:
  - platform: homeassistant
    id: timer_status
    entity_id: sensor.esphome_czas_vip_odliczanie
    on_value:
      then:
        - lambda: |-
            if (x == "idle" || x == "GOTOWY") {
              lv_label_set_text(id(timer_label), "CZAS VIP: GOTOWY");
            } else {
              lv_label_set_text(id(timer_label), ("CZAS VIP: " + x).c_str());
            }

# ==========================================
# BINARY SENSORS - PREMIUM VIP LOGIC
# Stan ON:  Magenta glow + jaśniejsze tło + grubszy border
# Stan OFF: Cyan subtletny + ciemne tło + cienki border
# ==========================================
