# =============================================================================
# Automatyzacja: Ratunkowy restart sieci Deco (Sonoff Offline)
# =============================================================================
# PROBLEMY ZNALEZIONE W ORYGINALE:
# 1. Brak zdefiniowanego countera w configuration.yaml - counter nie istnieje
# 2. Brak continue_on_error na akcji reboot - jeśli reboot rzuci błąd,
#    kolejne akcje (w tym counter.increment) się nie wykonają
# 3. Counter.increment był TYLKO po reboot - przeniesiony PRZED reboot
#    żeby zliczał każdą próbę restartu (nawet nieudaną)
# 4. Dodano powiadomienie po restarcie (potwierdzenie wykonania)
# 5. Poprawiony warunek cooldown na bardziej niezawodny
# =============================================================================

alias: Ratunkowy restart sieci Deco (Sonoff Offline)
description: >-
  Powiadamia po 4 minutach, czeka minutę i restartuje wszystkie routery Deco.
  Zlicza restarty w counter.licznik_restartow_deco_przez_sonoff.

triggers:
  - trigger: state
    entity_id:
      - switch.sonoff_100250b047_1
      - switch.sonoff_100250b047_2
      - switch.sonoff_100250ad43_1
      - switch.sonoff_100250ad43_2
      - switch.sonoff_100267fc75_1
      - switch.sonoff_100267fc75_2
      - switch.sonoff_100250ad5f_1
      - switch.sonoff_100250ad5f_2
    to: unavailable
    for:
      minutes: 4

conditions:
  # Cooldown: nie uruchamiaj częściej niż raz na godzinę
  - condition: template
    value_template: >-
      {% set last = this.attributes.last_triggered %}
      {{ last is none or (now() - last).total_seconds() > 3600 }}

actions:
  # 1. Powiadomienie ostrzegawcze
  - action: notify.notify
    data:
      title: "⚠️ Uwaga! Restart Wi-Fi za minutę"
      message: >-
        Urządzenie {{ trigger.to_state.name }} ({{ trigger.entity_id }})
        nie odpowiada od 4 minut. Za 60 sekund nastąpi ratunkowy restart
        wszystkich routerów Deco!

  # 2. Czekaj minutę
  - delay:
      minutes: 1

  # 3. Sprawdź czy urządzenie nadal jest niedostępne
  - condition: template
    value_template: "{{ is_state(trigger.entity_id, 'unavailable') }}"

  # 4. NAJPIERW zlicz restart (przed rebootem!)
  #    Dzięki temu nawet jeśli reboot się nie uda, mamy zapis próby
  - action: counter.increment
    target:
      entity_id: counter.licznik_restartow_deco_przez_sonoff

  # 5. Restart routerów Deco (z continue_on_error)
  - action: tplink_deco.reboot_deco
    data:
      device_id:
        - 2eaed5d7ab596ef9f95c2c9981e0c2fa
        - 93a1ce261ec4052e900f3935595bd9e6
        - a1aef6458154777c4c4127d88a81252f
        - 3cdc8aa96818ce3ac52b7f58433ec2ed
    continue_on_error: true

  # 6. Powiadomienie potwierdzające
  - action: notify.notify
    data:
      title: "🔄 Restart Deco wykonany"
      message: >-
        Wykonano ratunkowy restart routerów Deco.
        Przyczyna: {{ trigger.to_state.name }} offline.
        Sieć powinna wrócić za 2-3 minuty.

mode: single
